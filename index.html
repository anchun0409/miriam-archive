<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>楊千嬅Live曲目誌</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <a href="index.html" class="brand-title">楊千嬅Live曲目誌</a>
      <div class="brand-sub">期待再期待 下一首遺珠上桌</div>
    </div>
    <nav class="site-nav">
      <a href="index.html" class="active">歌曲</a>
      <a href="funfacts.html">Fun Facts</a>
      <a href="concerts.html">Sources</a>
    </nav>
  </header>

  <main>
    <div class="search-wrap">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input id="search-input" type="text" placeholder="搜尋歌名…" autocomplete="off" />
    </div>
    <div class="list-toolbar">
      <div class="filter-pills" role="group" aria-label="演出狀態篩選">
        <button type="button" class="filter-pill active" data-live-filter="all">全部</button>
        <button type="button" class="filter-pill" data-live-filter="performed">已有Live版</button>
        <button type="button" class="filter-pill" data-live-filter="never">尚未有Live版</button>
      </div>
      <div class="song-controls" id="song-controls">
        <select id="song-sort" class="song-sort" aria-label="排序">
          <option value="shows-desc">按演出場次 高→低</option>
          <option value="shows-asc">按演出場次 低→高</option>
        </select>
        <div class="silent-since" id="silent-since" title="拖曳以篩選：自該年後未再演唱的歌曲">
          <span class="silent-since-label" id="silent-since-text">不限</span>
          <input type="range" id="silent-since-year" class="silent-since-input" aria-label="自某年後未唱過" />
        </div>
      </div>
      <div class="result-count" id="result-count"></div>
    </div>

    <div class="song-grid" id="song-grid"></div>
  </main>

  <div class="modal-backdrop" id="setlist-modal" role="dialog" aria-modal="true" aria-labelledby="setlist-modal-title">
    <div class="modal-panel">
      <button type="button" class="modal-close" data-close-modal aria-label="關閉">×</button>
      <div class="modal-header">
        <div class="modal-title" id="setlist-modal-title"></div>
        <div class="modal-sub" id="setlist-modal-sub"></div>
      </div>
      <label class="session-select-label" for="setlist-session-select">場次</label>
      <select id="setlist-session-select" class="session-select"></select>
      <div class="setlist-list" id="setlist-modal-list"></div>
    </div>
  </div>

  <footer class="site-disclaimer">
    <strong>關於本站與致謝</strong>
    <p>本網站是由千嬅歌迷自發製作的非官方歌曲資料庫，整理千嬅在演唱會中的歌曲演出紀錄，方便查詢每首歌曾在哪些演唱會演出，也順便提醒哪些歌曲還未唱過live (bushi)。資料仍在持續整理，如有疏漏，歡迎指正～特別感謝羽佩與 Frankie 最初的《楊千嬅演唱會 Live 歌曲熱力圖》帶來啟發，以及羽佩的<a href="https://elaineyupei.github.io/my-live-chart/#lang=hant" target="_blank" rel="noopener noreferrer">《楊千嬅 Live 影響力係數榜》</a>整理的歌單與場次資料；亦感謝其他歌迷各平台無私分享歌單，讓這份紀錄更完整。</p>
    <p class="disclaimer-meta">設計與維護：anchun<span class="disclaimer-gap"></span><span class="last-updated" id="last-updated">最後更新：—</span></p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/overlay.js"></script>
  <script src="js/last-updated.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
